version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: cityguide-db
    environment:
      POSTGRES_USER: cityguide
      POSTGRES_PASSWORD: cityguide
      POSTGRES_DB: cityguide
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityguide"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    container_name: cityguide-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cityguide:cityguide@db:5432/cityguide
      ENVIRONMENT: production
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./alembic:/app/alembic
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

volumes:
  postgres_data:
